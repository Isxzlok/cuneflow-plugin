name: CUNEFLOW CLI CI

on:
  push:
    paths:
      - "cuneflow_cli/**"
      - ".github/workflows/cuneflow-cli-ci.yml"
  pull_request:
    paths:
      - "cuneflow_cli/**"
      - ".github/workflows/cuneflow-cli-ci.yml"

defaults:
  run:
    shell: bash
    working-directory: cuneflow_cli

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Pack and install smoke test
        run: |
          package_file=$(npm pack --silent)
          npm install --global "./${package_file}"
          cuneflow --version
          cuneflow --help
          if cuneflow unknown-command; then
            echo "unknown command unexpectedly succeeded"
            exit 1
          fi
