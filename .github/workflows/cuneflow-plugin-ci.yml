name: CUNEFLOW Plugin CI

on:
  push:
    paths:
      - "cuneflow_plugin/**"
      - "cuneflow_cli/skills/**"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/cuneflow-plugin-ci.yml"
  pull_request:
    paths:
      - "cuneflow_plugin/**"
      - "cuneflow_cli/skills/**"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/cuneflow-plugin-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm --prefix cuneflow_plugin test
